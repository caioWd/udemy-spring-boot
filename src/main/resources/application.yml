spring:
  datasource:
    url: jdbc:mysql://localhost:3306/db_name?useTimeZone=True&serverTimeZone=UTC
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: false